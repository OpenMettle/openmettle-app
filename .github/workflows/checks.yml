name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 scripts/check_repository.py
      - name: Test browser qualification inputs
        run: python3 -m unittest discover -s test/qualification
      - name: Test iOS registration and associated-domain generation
        run: python3 -m unittest discover -s ios/Flutter

  ios:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Configure the debug simulator build
        run: >-
          flutter build ios --simulator --debug --config-only --no-pub
          --dart-define=OPENMETTLE_NATIVE_ISSUER=https://app.relying.test:18443
          --dart-define=OPENMETTLE_NATIVE_CLIENT_ID=synthetic.ios
          --dart-define=OPENMETTLE_NATIVE_REDIRECT_URI=https://return.relying.test/native/complete
      - name: Test the iOS host and Flutter launch
        run: |
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:RunnerTests -only-testing:RunnerUITests \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
      - name: Check the packaged simulator registration and HTTPS callback entitlement
        run: bash test/qualification/ios_simulator_bundle.sh "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Runner.app"
  flutter:
    name: Flutter web client
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_SERIAL: emulator-5554
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up pinned Flutter and the runner’s Android SDK tools
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --platform chrome test/api/fetch_transport_browser_test.dart
      - name: Build Flutter for the qualification origin
        run: >-
          flutter build web --no-pub --no-web-resources-cdn
          --dart-define=OPENMETTLE_LOGIN_PATH=/login
          --dart-define=OPENMETTLE_SESSION_PATH=/session
          --dart-define=OPENMETTLE_LOGOUT_PATH=/logout
      - name: Check out the core revision that supplied the consumer fixtures
        run: |
          core_pin=$(sed -n '/^[0-9a-f]\{40\}$/p' test/fixtures/core/MANIFEST)
          [[ "$core_pin" =~ ^[0-9a-f]{40}$ ]]
          core_dir="$RUNNER_TEMP/openmettle-core"
          git init --quiet "$core_dir"
          git -C "$core_dir" fetch --quiet --depth 1 https://github.com/OpenMettle/openmettle-core.git "$core_pin"
          git -C "$core_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$core_dir" rev-parse HEAD)" = "$core_pin"
          echo "CORE_DIR=$core_dir" >> "$GITHUB_ENV"
      - name: Build the API and migrator
        working-directory: ${{ runner.temp }}/openmettle-core
        run: cargo build --locked --bin openmettle-api --bin openmettle-migrate
      - name: Build the debug APK for the emulator
        run: >-
          flutter build apk --debug --no-pub --target-platform android-x64
          --dart-define=OPENMETTLE_NATIVE_ISSUER=https://app.relying.test:18443
          --dart-define=OPENMETTLE_NATIVE_CLIENT_ID=synthetic.android
          --dart-define=OPENMETTLE_NATIVE_REDIRECT_URI=https://return.relying.test/native/complete
      - name: Test the Android host
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/openmettle-debug.apk"
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Start the Android API 33 emulator
        timeout-minutes: 18
        run: bash test/qualification/emulator.sh
      - name: Install qualification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-light libnss3-tools python3-websocket
      - name: Qualify Flutter web and Android sign-in with Keycloak
        timeout-minutes: 45
        env:
          PROVIDER_IMAGE: quay.io/keycloak/keycloak@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          APP_APK: ${{ runner.temp }}/openmettle-debug.apk
          APP_WEB_DIR: ${{ github.workspace }}/build/web
        run: bash test/qualification/run.sh
